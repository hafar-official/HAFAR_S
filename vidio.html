<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Video - HAFAR</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: #1e3a5f; color: #fff; padding: 20px 0; text-align: center; }
        header h1 { font-size: 2.2rem; letter-spacing: 1px; }
        nav { background-color: #2c4d75; display: flex; justify-content: center; padding: 10px 0; gap: 10px; flex-wrap: wrap; }
        nav a { color: #fff; text-decoration: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; transition: background-color 0.3s; }
        nav a:hover, nav a.active-page { background-color: #3b71ca; }
        .container { max-width: 1000px; margin: 30px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); flex: 1; }
        .container h2 { margin-bottom: 10px; color: #1e3a5f; }
        .container p { margin-bottom: 20px; color: #666; }
        
        /* Grid khusus video agar responsif */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; justify-items: center; }
        .video-item { background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.03); width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
        
        /* CSS Utama untuk Video Potret: memaksa rasio tinggi */
        .video-portrait video { width: 100%; height: auto; aspect-ratio: 9 / 16; /* Rasio potret standar */ object-fit: cover; border-radius: 6px; background-color: #000; max-height: 80vh; /* Agar tidak terlalu tinggi di layar kecil */ }
        
        /* CSS Utama untuk Video Landscape: memaksa rasio lebar */
        .video-landscape video { width: 100%; height: auto; aspect-ratio: 16 / 9; /* Rasio landscape standar */ object-fit: cover; border-radius: 6px; background-color: #000; }
        
        .video-item p { margin-top: 15px; font-weight: bold; color: #444; }
        .footer { background-color: #e9ecef; text-align: center; padding: 15px; font-size: 0.9rem; color: #777; margin-top: 30px; }
    </style>
</head>
<body>
    <header><h1>HAFAR</h1></header>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="gallery.html">Foto</a>
        <a href="video.html" class="active-page">Video</a>
    </nav>
    <div class="container">
        <h2>Galeri Video HAFAR</h2>
        <p>Koleksi dokumentasi video kegiatan HAFAR:</p>
        <div class="video-grid">
            
            <!-- CONTOH VIDEO POTRET (Gunakan class video-portrait) -->
            <div class="video-item video-portrait">
                <video controls preload="metadata">
                    <source src="Jagung-Vid.mp4" type="video/mp4">
                    Browser Anda tidak mendukung pemutaran video.
                </video>
                <p>Dokumentasi 3 (Potret)</p>
            </div>
            
            <!-- CONTOH VIDEO LANDSCAPE (Gunakan class video-landscape jika ada) -->
            <!-- 
            <div class="video-item video-landscape">
                <video controls preload="metadata">
                    <source src="nama-file-video-landscape.mp4" type="video/mp4">
                    Browser Anda tidak mendukung pemutaran video.
                </video>
                <p>Dokumentasi Lain (Landscape)</p>
            </div> 
            -->
            
        </div>
    </div>
    <div class="footer">&copy; 2026 HAFAR. Semua hak dilindungi.</div>
</body>
</html>
