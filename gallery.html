<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Foto - HAFAR</title>
    <link rel="stylesheet" href="style.css">
    <!-- SDK Firebase Compat (Cukup Auth & Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <header>
        <button class="menu-btn" onclick="toggleSidebar()">&#9776;</button>
        <h1>HAFAR</h1>
    </header>

    <!-- Sidebar / Menu Strip Tiga -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>Menu HAFAR</h2>
            <button class="close-sidebar-btn" onclick="toggleSidebar()">&times;</button>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="gallery.html" class="active-page">Gallery</a>
            <a href="video.html">Video</a>
            
            <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.2);">
                <div id="sidebar-logged-out">
                    <button onclick="showLoginModal()" style="width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Login Anggota</button>
                </div>
                <div id="sidebar-logged-in" style="display: none;">
                    <p style="font-size: 0.85rem; color: #a7f3d0; margin-bottom: 8px;">✓ Logged in: <span id="user-email-display" style="font-weight: bold;"></span></p>
                    <button onclick="logout()" style="width: 100%; padding: 8px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Logout</button>
                </div>
            </div>
        </nav>
    </div>
    <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

    <div class="container">
        <h2>Galeri Foto HAFAR</h2>
        <p>Dokumentasi foto kegiatan siswa PKL HAFAR.</p>

        <!-- Area Form Upload -->
        <div id="upload-container" style="display: none; background: #f8fafc; padding: 1.2rem; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 20px;">
            <h4 style="margin-bottom: 8px; color: var(--primary);">Upload Foto Kegiatan:</h4>
            <input type="file" id="photo-input" accept="image/*" style="margin-bottom: 10px; display: block;">
            <input type="text" id="photo-title" placeholder="Judul / Keterangan Foto" style="width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px;">
            <button onclick="uploadPhoto()" id="upload-btn" style="padding: 8px 16px; background: #10b981; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Upload ke Galeri</button>
            <p id="upload-status" style="font-size: 0.85rem; margin-top: 5px; color: #2563eb;"></p>
        </div>
        
        <div class="grid" id="gallery-grid">
            <div class="card">
                <img src="Ketindan.jpg" alt="Dokumentasi 1" onclick="openLightbox(this)">
                <p>Dokumentasi 1</p>
            </div>
            <div class="card">
                <img src="Jagung.jpeg" alt="Dokumentasi 2" onclick="openLightbox(this)">
                <p>Dokumentasi 2</p>
            </div>
        </div>
    </div>

    <!-- Modal Form Login -->
    <div id="login-modal" class="lightbox">
        <div style="background: white; padding: 2rem; border-radius: 12px; width: 90%; max-width: 380px; position: relative;">
            <span class="close-btn" onclick="closeLoginModal()" style="color: #333; top: 10px; right: 15px;">&times;</span>
            <h3 style="color: var(--primary); margin-bottom: 1rem;">Login Anggota HAFAR</h3>
            
            <input type="email" id="login-email" placeholder="Email Anggota" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px;">
            <input type="password" id="login-password" placeholder="Password" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px;">
            
            <button onclick="login()" id="login-btn" style="width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Masuk</button>
            <p id="login-error" style="color: red; font-size: 0.85rem; margin-top: 10px; text-align: center;"></p>
        </div>
    </div>

    <!-- Modal Lightbox Pratinjau Foto -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <div class="footer">&copy; 2026 HAFAR. Semua hak dilindungi.</div>

    <script>
        const IMGBB_API_KEY = "d2008edc8af801a4d04555899d1f0da8";

        const firebaseConfig = {
            apiKey: "AIzaSyCFrS9L0YFDB29-n5OvC2EkVFKclW2wRTk",
            authDomain: "hafar-web.firebaseapp.com",
            projectId: "hafar-web",
            storageBucket: "hafar-web.firebasestorage.app",
            messagingSenderId: "887471904367",
            appId: "1:887471904367:web:c5bb4694916a522dbf9f9a",
            measurementId: "G-Y5WWTJSFFK"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('sidebar-logged-out').style.display = 'none';
                document.getElementById('sidebar-logged-in').style.display = 'block';
                document.getElementById('user-email-display').innerText = user.email;
                document.getElementById('upload-container').style.display = 'block';
            } else {
                document.getElementById('sidebar-logged-out').style.display = 'block';
                document.getElementById('sidebar-logged-in').style.display = 'none';
                document.getElementById('upload-container').style.display = 'none';
            }
        });

        function login() {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value;
            const errorMsg = document.getElementById('login-error');
            const loginBtn = document.getElementById('login-btn');

            if (!email || !pass) {
                errorMsg.innerText = "Harap isi email dan password terlebih dahulu!";
                return;
            }

            errorMsg.innerText = "";
            loginBtn.disabled = true;
            loginBtn.innerText = "Memproses...";

            auth.signInWithEmailAndPassword(email, pass)
                .then(() => {
                    closeLoginModal();
                    document.getElementById('login-email').value = "";
                    document.getElementById('login-password').value = "";
                    loginBtn.disabled = false;
                    loginBtn.innerText = "Masuk";
                })
                .catch(err => {
                    loginBtn.disabled = false;
                    loginBtn.innerText = "Masuk";
                    errorMsg.innerText = "Login gagal! Periksa kembali email dan password Anda.";
                });
        }

        function logout() { auth.signOut(); }

        async function uploadPhoto() {
            const fileInput = document.getElementById('photo-input');
            const titleInput = document.getElementById('photo-title').value.trim();
            const file = fileInput.files[0];
            const status = document.getElementById('upload-status');
            const uploadBtn = document.getElementById('upload-btn');

            if (!file) return alert("Pilih foto terlebih dahulu!");
            if (!titleInput) return alert("Isi judul/keterangan foto!");

            status.innerText = "Mengunggah foto ke server...";
            uploadBtn.disabled = true;

            const formData = new FormData();
            formData.append("image", file);

            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: "POST",
                    body: formData
                });
                const result = await response.json();

                if (result.success) {
                    const imageUrl = result.data.url;
                    await db.collection('photos').add({
                        url: imageUrl,
                        title: titleInput,
                        createdAt: new Date()
                    });

                    status.innerText = "Foto berhasil di-upload!";
                    fileInput.value = "";
                    document.getElementById('photo-title').value = "";
                    uploadBtn.disabled = false;
                    loadPhotos();
                } else {
                    throw new Error("Gagal mengunggah foto ke ImgBB");
                }
            } catch (err) {
                uploadBtn.disabled = false;
                status.innerText = "Gagal upload: " + err.message;
            }
        }

        function loadPhotos() {
            db.collection('photos').orderBy('createdAt', 'desc').get().then(snapshot => {
                const grid = document.getElementById('gallery-grid');
                document.querySelectorAll('.uploaded-card').forEach(el => el.remove());

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const card = document.createElement('div');
                    card.className = 'card uploaded-card';
                    card.innerHTML = `
                        <img src="${data.url}" alt="${data.title}" onclick="openLightbox(this)">
                        <p>${data.title}</p>
                    `;
                    grid.prepend(card);
                });
            }).catch(err => console.log("Menunggu data foto..."));
        }
        loadPhotos();

        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("active");
            document.getElementById("overlay").classList.toggle("active");
        }

        function showLoginModal() {
            toggleSidebar();
            document.getElementById("login-modal").style.display = "flex";
        }

        function closeLoginModal() {
            document.getElementById("login-modal").style.display = "none";
            document.getElementById('login-error').innerText = "";
        }

        function openLightbox(element) {
            document.getElementById("lightbox").style.display = "flex";
            document.getElementById("lightbox-img").src = element.src;
        }

        function closeLightbox() {
            document.getElementById("lightbox").style.display = "none";
        }
    </script>
</body>
</html>
