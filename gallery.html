<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Foto - HAFAR</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: #1e3a5f; color: #fff; padding: 20px 0; text-align: center; }
        header h1 { font-size: 2.2rem; letter-spacing: 1px; }
        nav { background-color: #2c4d75; display: flex; justify-content: center; padding: 10px 0; gap: 10px; flex-wrap: wrap; }
        nav a { color: #fff; text-decoration: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; transition: background-color 0.3s; }
        nav a:hover, nav a.active-page { background-color: #3b71ca; }
        .container { max-width: 1000px; margin: 30px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); flex: 1; }
        .container h2 { margin-bottom: 10px; color: #1e3a5f; }
        .container p { margin-bottom: 20px; color: #666; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .gallery-item { background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .gallery-item img { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; background-color: #eaeaea; }
        .gallery-item p { margin-top: 10px; font-weight: bold; color: #444; }
        .footer { background-color: #e9ecef; text-align: center; padding: 15px; font-size: 0.9rem; color: #777; margin-top: 30px; }
    </style>
</head>
<body>
    <header><h1>HAFAR</h1></header>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="gallery.html" class="active-page">Foto</a>
        <a href="video.html">Video</a> <!-- Link baru ke halaman video -->
    </nav>
    <div class="container">
        <h2>Galeri Foto HAFAR</h2>
        <p>Koleksi foto kegiatan HAFAR:</p>
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="Ketindan.jpg" alt="Dokumentasi 1">
                <p>Dokumentasi 1</p>
            </div>
            <div class="gallery-item">
                <img src="Jagung.jpeg" alt="Dokumentasi 2">
                <p>Dokumentasi 2</p>
            </div>
        </div>
    </div>
    <div class="footer">&copy; 2026 HAFAR. Semua hak dilindungi.</div>
</body>
</html>
