<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Foto - HAFAR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <button class="menu-btn" onclick="toggleSidebar()">&#9776;</button>
        <h1>HAFAR</h1>
    </header>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>Menu HAFAR</h2>
            <button class="close-sidebar-btn" onclick="toggleSidebar()">&times;</button>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="gallery.html" class="active-page">Gallery</a>
            <a href="video.html">Video</a>
        </nav>
    </div>
    <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

    <div class="container">
        <h2>Galeri Foto HAFAR</h2>
        <p>Klik foto untuk melihat tampilan penuh (fullscreen):</p>
        
        <div class="grid">
            <div class="card">
                <img src="Ketindan.jpg" alt="Dokumentasi 1" onclick="openLightbox(this)">
                <p>Dokumentasi 1</p>
            </div>
            <div class="card">
                <img src="Jagung.jpeg" alt="Dokumentasi 2" onclick="openLightbox(this)">
                <p>Dokumentasi 2</p>
            </div>
        </div>
    </div>

    <!-- Modal Lightbox -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <div class="footer">&copy; 2026 HAFAR. Semua hak dilindungi.</div>

    <script>
        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("active");
            document.getElementById("overlay").classList.toggle("active");
        }
        function openLightbox(element) {
            document.getElementById("lightbox").style.display = "flex";
            document.getElementById("lightbox-img").src = element.src;
        }
        function closeLightbox() {
            document.getElementById("lightbox").style.display = "none";
        }
    </script>
</body>
</html>
